name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lint tool
        run: python -m pip install ruff==0.13.2
      - name: Lint Python
        run: ruff check scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate fixtures
        run: |
          python scripts/validate_workspace.py tests/fixtures/repository
          python scripts/validate_workspace.py tests/fixtures/learning
      - name: Validate JSON manifests and eval definitions
        run: |
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool evals/cases.json >/dev/null
          python -m json.tool evals/judge-schema.json >/dev/null
