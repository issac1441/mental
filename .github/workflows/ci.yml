name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lint tool
        run: python -m pip install ruff==0.13.2
      - name: Lint Python
        run: ruff check scripts tests evals
      - name: Compile Python
        run: python -m compileall -q scripts tests evals
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run eval fixture tests
        run: python -m unittest discover -s evals/fixtures/orderflow/tests -t evals/fixtures/orderflow -v
      - name: Validate fixtures
        run: |
          python scripts/validate_workspace.py tests/fixtures/repository
          python scripts/validate_workspace.py tests/fixtures/learning
      - name: Validate JSON manifests and eval definitions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [Path(".claude-plugin"), Path(".codex-plugin"), Path("evals"), Path("tests")]
          paths = sorted(path for root in roots for path in root.rglob("*.json"))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"validated {len(paths)} JSON files")
          PY
